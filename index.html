<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>

    <h1>Welcome to My Page</h1>
    <p>This is a simple paragraph of text in this space. HTML is used to structure web content.</p>

    <h2>Common HTML Elements</h2>
    <ul>
        <li><strong>Bold text</strong> using the strong tag.</li>
        <li><em>Italic text</em> using the em tag.</li>
        <li><a href="https://google.com" target="_blank">A hyperlink</a> to another site.</li>
    </ul>

    <h3>Example Table</h3>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Role</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>Developer</td>
        </tr>
    </table>

</body>
</html>
