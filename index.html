<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sample Website</title>
    <style>
        /* Basic internal styling */
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 20px; }
        header { background: #f4f4f4; padding: 10px; text-align: center; }
        nav { margin: 10px 0; }
        footer { margin-top: 20px; font-size: 0.8em; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <nav>
        <a href="#about">About</a> | 
        <a href="https://www.w3schools.com" target="_blank">External Link</a>
    </nav>

    <main>
        <section id="about">
            <h2>About This Page</h2>
            <p>This is a simple paragraph showing how to structure a webpage.</p>
            <ul>
                <li>First feature</li>
                <li>Second feature</li>
            </ul>
        </section>

        <section>
            <h2>Image Example</h2>
            <img src="https://placeholder.com" alt="Placeholder Image">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Sample Site</p>
    </footer>

</body>
</html>
